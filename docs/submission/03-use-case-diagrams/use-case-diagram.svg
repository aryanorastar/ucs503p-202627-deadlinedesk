<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1000"><title id="title">DeadlineDesk use-case diagram</title><desc id="desc">Student, TA or Faculty, and Placement Admin actors connected to placement and academic use cases.</desc><defs><style>.bg{fill:#f7f5ef}.boundary{fill:#fff;stroke:#14213d;stroke-width:3}.actor{fill:#14213d}.actor-label{font:700 25px Arial,sans-serif;fill:#14213d;text-anchor:middle}.uc,.uc2{fill:#fff8e7;stroke:#d38b00;stroke-width:2}.uc2{fill:#eef4ff;stroke:#275dad}.uct{font:600 20px Arial,sans-serif;fill:#14213d;text-anchor:middle}.title{font:700 40px Arial,sans-serif;fill:#14213d}.section{font:700 24px Arial,sans-serif;fill:#6c7280;letter-spacing:2px}.dash,.edge{stroke-width:2;fill:none}.edge{stroke:#546078}.dash{stroke:#8b93a4;stroke-dasharray:8 7}.note{font:16px Arial,sans-serif;fill:#6c7280;text-anchor:middle}</style></defs><rect width="1600" height="1000" class="bg"/><text x="800" y="58" class="title" text-anchor="middle">DeadlineDesk — Use-Case Diagram</text><rect width="1080" height="850" x="260" y="92" class="boundary" rx="22"/><text x="800" y="130" class="section" text-anchor="middle">SYSTEM BOUNDARY</text><g transform="translate(118 255)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" x2="0" y1="28" y2="105" class="edge"/><line x1="-48" x2="48" y1="55" y2="55" class="edge"/><line x1="0" x2="-42" y1="105" y2="165" class="edge"/><line x1="0" x2="42" y1="105" y2="165" class="edge"/><text x="0" y="205" class="actor-label">Student</text></g><g transform="translate(1482 280)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" x2="0" y1="28" y2="105" class="edge"/><line x1="-48" x2="48" y1="55" y2="55" class="edge"/><line x1="0" x2="-42" y1="105" y2="165" class="edge"/><line x1="0" x2="42" y1="105" y2="165" class="edge"/><text x="0" y="205" class="actor-label">TA / Faculty</text></g><g transform="translate(1482 680)"><circle cx="0" cy="0" r="28" class="actor"/><line x1="0" x2="0" y1="28" y2="105" class="edge"/><line x1="-48" x2="48" y1="55" y2="55" class="edge"/><line x1="0" x2="-42" y1="105" y2="165" class="edge"/><line x1="0" x2="42" y1="105" y2="165" class="edge"/><text x="0" y="205" class="actor-label">Placement Admin</text></g><path d="M165 310 L410 190 M165 320 L410 295 M165 330 L410 400 M165 340 L410 505 M165 350 L410 610 M165 360 L410 715 M165 370 L410 820" class="edge"/><path d="M1435 335 L1190 265 M1435 345 L1190 390 M1435 355 L1190 515 M1435 735 L1190 665 M1435 745 L1190 790 M1435 755 L1190 890" class="edge"/><ellipse cx="570" cy="190" class="uc" rx="165" ry="48"/><text x="570" y="185" class="uct"><tspan x="570">Authenticate and open</tspan><tspan x="570" dy="24">role dashboard</tspan></text><ellipse cx="570" cy="295" class="uc" rx="165" ry="48"/><text x="570" y="302" class="uct">View placement rounds</text><ellipse cx="570" cy="400" class="uc" rx="165" ry="48"/><text x="570" y="395" class="uct"><tspan x="570">Complete document</tspan><tspan x="570" dy="24">checklist</tspan></text><ellipse cx="570" cy="505" class="uc" rx="165" ry="48"/><text x="570" y="512" class="uct">View readiness result</text><ellipse cx="570" cy="610" class="uc2" rx="165" ry="48"/><text x="570" y="617" class="uct">View assignments</text><ellipse cx="570" cy="715" class="uc2" rx="165" ry="48"/><text x="570" y="722" class="uct">Upload submission</text><ellipse cx="570" cy="820" class="uc2" rx="165" ry="48"/><text x="570" y="815" class="uct"><tspan x="570">View late decision,</tspan><tspan x="570" dy="24">grade, and feedback</tspan></text><ellipse cx="1030" cy="265" class="uc2" rx="180" ry="52"/><text x="1030" y="260" class="uct"><tspan x="1030">Publish assignment</tspan><tspan x="1030" dy="24">and late policy</tspan></text><ellipse cx="1030" cy="390" class="uc2" rx="180" ry="52"/><text x="1030" y="385" class="uct"><tspan x="1030">Review submission and</tspan><tspan x="1030" dy="24">similarity stub</tspan></text><ellipse cx="1030" cy="515" class="uc2" rx="180" ry="52"/><text x="1030" y="510" class="uct"><tspan x="1030">Grade submission</tspan><tspan x="1030" dy="24">and add feedback</tspan></text><ellipse cx="1030" cy="665" class="uc" rx="180" ry="52"/><text x="1030" y="660" class="uct"><tspan x="1030">Create company and</tspan><tspan x="1030" dy="24">placement round</tspan></text><ellipse cx="1030" cy="790" class="uc" rx="180" ry="52"/><text x="1030" y="785" class="uct"><tspan x="1030">Add required</tspan><tspan x="1030" dy="24">checklist items</tspan></text><ellipse cx="1030" cy="890" class="uc" rx="180" ry="40"/><text x="1030" y="885" class="uct"><tspan x="1030">Publish round and persist</tspan><tspan x="1030" dy="24">T-24h reminder</tspan></text><path d="M735 400 C805 400 805 505 735 505" class="dash"/><text x="790" y="460" class="note">updates</text><path d="M850 390 C790 500 790 650 735 715" class="dash"/><text x="805" y="585" class="note">policy applies</text><path d="M1030 442 L1030 463" class="dash"/><text x="1110" y="458" class="note">precedes</text><path d="M1030 717 L1030 738" class="dash"/><text x="1120" y="734" class="note">requires</text><path d="M1030 842 L1030 850" class="dash"/><text x="1120" y="858" class="note">enables</text></svg>