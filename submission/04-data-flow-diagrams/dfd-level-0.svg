<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">DeadlineDesk Level 0 data-flow diagram</title>
  <desc id="desc">Context-level data exchange between DeadlineDesk and Student, TA or Faculty, and Placement Admin.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#56637b"/></marker>
    <style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#12213f;stroke-width:4}.proc{fill:#12213f;stroke:#d88a00;stroke-width:9}.title{font:700 45px Arial,sans-serif;fill:#12213f}.extt{font:700 30px Arial,sans-serif;fill:#12213f;text-anchor:middle;word-spacing:4px}.proct{font:700 38px Arial,sans-serif;fill:#fff;text-anchor:middle;word-spacing:4px}.flow{stroke:#56637b;stroke-width:4;fill:none;marker-end:url(#arrow)}.labelbox{fill:#f7f5ef;opacity:.96}.label{font:600 23px Arial,sans-serif;fill:#30394c;text-anchor:middle;word-spacing:4px}.foot{font:20px Arial,sans-serif;fill:#687389;word-spacing:3px}</style>
  </defs>
  <rect class="bg" width="1800" height="1000"/>
  <text class="title" x="900" y="65" text-anchor="middle">DeadlineDesk&#160;-&#160;Data-Flow&#160;Diagram&#160;(Level&#160;0)</text>
  <rect class="ext" x="70" y="380" width="300" height="130" rx="12"/><text class="extt" x="220" y="455">Student</text>
  <rect class="ext" x="1430" y="155" width="300" height="130" rx="12"/><text class="extt" x="1580" y="230">TA / Faculty</text>
  <rect class="ext" x="1430" y="715" width="300" height="130" rx="12"/><text class="extt" x="1580" y="790">Placement Admin</text>
  <circle class="proc" cx="900" cy="505" r="205"/><text class="proct" x="900" y="492"><tspan x="900">0.</tspan><tspan x="900" dy="48">DeadlineDesk</tspan></text>

  <path class="flow" d="M370 415 C530 405 600 420 695 465"/>
  <rect class="labelbox" x="390" y="333" width="365" height="65" rx="8"/><text class="label" x="572" y="360"><tspan x="572">credentials,&#160;checklist&#160;updates,</tspan><tspan x="572" dy="27">submission&#160;file</tspan></text>
  <path class="flow" d="M695 555 C590 610 510 625 365 595"/>
  <rect class="labelbox" x="390" y="626" width="370" height="65" rx="8"/><text class="label" x="575" y="653"><tspan x="575">readiness,&#160;late&#160;result,</tspan><tspan x="575" dy="27">grade&#160;and&#160;feedback</tspan></text>

  <path class="flow" d="M1430 215 C1285 220 1195 290 1070 385"/>
  <rect class="labelbox" x="1095" y="165" width="325" height="65" rx="8"/><text class="label" x="1258" y="192"><tspan x="1258">assignment&#160;policy,</tspan><tspan x="1258" dy="27">review&#160;and&#160;grade</tspan></text>
  <path class="flow" d="M1100 420 C1230 340 1320 315 1435 325"/>
  <rect class="labelbox" x="1120" y="330" width="320" height="65" rx="8"/><text class="label" x="1280" y="357"><tspan x="1280">submission&#160;and</tspan><tspan x="1280" dy="27">similarity&#160;data</tspan></text>

  <path class="flow" d="M1430 775 C1280 775 1190 710 1065 625"/>
  <rect class="labelbox" x="1100" y="765" width="330" height="65" rx="8"/><text class="label" x="1265" y="792"><tspan x="1265">companies,&#160;rounds&#160;and</tspan><tspan x="1265" dy="27">checklist&#160;items</tspan></text>
  <path class="flow" d="M1095 585 C1225 675 1320 665 1435 655"/>
  <rect class="labelbox" x="1110" y="645" width="330" height="65" rx="8"/><text class="label" x="1275" y="672"><tspan x="1275">publication&#160;and</tspan><tspan x="1275" dy="27">reminder&#160;status</tspan></text>

  <text class="foot" x="70" y="950">Context diagram: internal processes and persistent stores are decomposed in Level 1.</text>
</svg>
