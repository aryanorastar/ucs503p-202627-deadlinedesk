<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" aria-labelledby="title desc" role="img" viewBox="0 0 1800 1100"><title id="title">DeadlineDesk use-case diagram</title><desc id="desc">Student, TA or Faculty, and Placement Admin actors associated with the Week 7 DeadlineDesk use cases.</desc><defs><style>.bg{fill:#f7f5ef}.boundary{fill:#fff;stroke:#12213f;stroke-width:4}.line{stroke:#53617b;stroke-width:3;fill:none}.actor{fill:#12213f}.actorline{stroke:#12213f;stroke-width:4;fill:none}.actorname{font:700 27px Arial,sans-serif;fill:#12213f;text-anchor:middle;word-spacing:4px}.uca,.ucp{stroke-width:3}.ucp{fill:#fff5da;stroke:#d88a00}.uca{fill:#edf3ff;stroke:#2862b8}.uct{font:600 25px Arial,sans-serif;fill:#12213f;text-anchor:middle;word-spacing:4px}.title{font:700 45px Arial,sans-serif;fill:#12213f}.section{font:700 22px Arial,sans-serif;fill:#687389;letter-spacing:2px}.legend{font:20px Arial,sans-serif;fill:#5f687a;word-spacing:3px}</style></defs><rect width="1800" height="1100" class="bg"/><text x="900" y="64" class="title" text-anchor="middle">DeadlineDesk - Use-Case Diagram</text><rect width="1280" height="900" x="260" y="105" class="boundary" rx="24"/><text x="610" y="150" class="section" text-anchor="middle">STUDENT ACTIONS</text><text x="1190" y="150" class="section" text-anchor="middle">STAFF ACTIONS</text><path d="M165 500 L420 235 M165 500 L420 375 M165 500 L420 515 M165 500 L420 655 M165 500 L420 795 M165 500 L420 935" class="line"/><path d="M1635 315 L1370 245 M1635 315 L1370 385 M1635 315 L1370 525" class="line"/><path d="M1635 785 L1370 665 M1635 785 L1370 805 M1635 785 L1370 945" class="line"/><ellipse cx="620" cy="235" class="ucp" rx="200" ry="55"/><text x="620" y="243" class="uct">View placement rounds</text><ellipse cx="620" cy="375" class="ucp" rx="200" ry="55"/><text x="620" y="368" class="uct"><tspan x="620">Complete document</tspan><tspan x="620" dy="29">checklist</tspan></text><ellipse cx="620" cy="515" class="ucp" rx="200" ry="55"/><text x="620" y="523" class="uct">View readiness result</text><ellipse cx="620" cy="655" class="uca" rx="200" ry="55"/><text x="620" y="663" class="uct">View assignments</text><ellipse cx="620" cy="795" class="uca" rx="200" ry="55"/><text x="620" y="803" class="uct">Upload submission</text><ellipse cx="620" cy="935" class="uca" rx="200" ry="55"/><text x="620" y="928" class="uct"><tspan x="620">View late decision,</tspan><tspan x="620" dy="29">grade and feedback</tspan></text><ellipse cx="1170" cy="245" class="uca" rx="200" ry="55"/><text x="1170" y="238" class="uct"><tspan x="1170">Publish assignment</tspan><tspan x="1170" dy="29">and late policy</tspan></text><ellipse cx="1170" cy="385" class="uca" rx="200" ry="55"/><text x="1170" y="393" class="uct">Review submission</text><ellipse cx="1170" cy="525" class="uca" rx="200" ry="55"/><text x="1170" y="518" class="uct"><tspan x="1170">Grade submission</tspan><tspan x="1170" dy="29">and add feedback</tspan></text><ellipse cx="1170" cy="665" class="ucp" rx="200" ry="55"/><text x="1170" y="658" class="uct"><tspan x="1170">Create company</tspan><tspan x="1170" dy="29">and placement round</tspan></text><ellipse cx="1170" cy="805" class="ucp" rx="200" ry="55"/><text x="1170" y="798" class="uct"><tspan x="1170">Add required</tspan><tspan x="1170" dy="29">checklist items</tspan></text><ellipse cx="1170" cy="945" class="ucp" rx="200" ry="55"/><text x="1170" y="938" class="uct"><tspan x="1170">Publish round and log</tspan><tspan x="1170" dy="29">T-24h reminder</tspan></text><g transform="translate(120 405)"><circle cx="0" cy="0" r="30" class="actor"/><path d="M0 30 V118 M-55 62 H55 M0 118 L-48 185 M0 118 L48 185" class="actorline"/><text x="0" y="230" class="actorname">Student</text></g><g transform="translate(1680 220)"><circle cx="0" cy="0" r="30" class="actor"/><path d="M0 30 V118 M-55 62 H55 M0 118 L-48 185 M0 118 L48 185" class="actorline"/><text x="0" y="230" class="actorname">TA / Faculty</text></g><g transform="translate(1680 690)"><circle cx="0" cy="0" r="30" class="actor"/><path d="M0 30 V118 M-55 62 H55 M0 118 L-48 185 M0 118 L48 185" class="actorline"/><text x="0" y="230" class="actorname">Placement Admin</text></g><text x="900" y="1060" class="legend" text-anchor="middle">Amber: Placement Track | Blue: Academic Dropbox | Solid line: actor association</text></svg>