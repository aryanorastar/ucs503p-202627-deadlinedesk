name: application-ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python code/manage.py check
      - run: python code/manage.py makemigrations --check
      - run: python code/manage.py migrate --noinput
      - run: python -m pytest
