<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" aria-labelledby="title desc" role="img" viewBox="0 0 1800 1000"><title id="title">DeadlineDesk Level 0 data-flow diagram</title><desc id="desc">Context-level data exchange between DeadlineDesk and Student, TA or Faculty, and Placement Admin.</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="4"><path fill="#56637b" d="M0,0 L12,4 L0,8 Z"/></marker><style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#12213f;stroke-width:4}.proc{fill:#12213f;stroke:#d88a00;stroke-width:9}.title{font:700 45px Arial,sans-serif;fill:#12213f}.extt,.proct{font:700 30px Arial,sans-serif;fill:#12213f;text-anchor:middle;word-spacing:4px}.proct{font:700 38px Arial,sans-serif;fill:#fff}.flow{stroke:#56637b;stroke-width:4;fill:none;marker-end:url(#arrow)}.labelbox{fill:#f7f5ef;opacity:.96}.label{font:600 23px Arial,sans-serif;fill:#30394c;text-anchor:middle;word-spacing:4px}.foot{font:20px Arial,sans-serif;fill:#687389;word-spacing:3px}</style></defs><rect width="1800" height="1000" class="bg"/><text x="900" y="65" class="title" text-anchor="middle">DeadlineDesk - Data-Flow Diagram (Level 0)</text><rect width="300" height="130" x="70" y="380" class="ext" rx="12"/><text x="220" y="455" class="extt">Student</text><rect width="300" height="130" x="1430" y="155" class="ext" rx="12"/><text x="1580" y="230" class="extt">TA / Faculty</text><rect width="300" height="130" x="1430" y="715" class="ext" rx="12"/><text x="1580" y="790" class="extt">Placement Admin</text><circle cx="900" cy="505" r="205" class="proc"/><text x="900" y="492" class="proct"><tspan x="900">0.</tspan><tspan x="900" dy="48">DeadlineDesk</tspan></text><path d="M370 415 C530 405 600 420 695 465" class="flow"/><rect width="365" height="65" x="390" y="333" class="labelbox" rx="8"/><text x="572" y="360" class="label"><tspan x="572">credentials, checklist updates,</tspan><tspan x="572" dy="27">submission file</tspan></text><path d="M695 555 C590 610 510 625 365 595" class="flow"/><rect width="370" height="65" x="390" y="626" class="labelbox" rx="8"/><text x="575" y="653" class="label"><tspan x="575">readiness, late result,</tspan><tspan x="575" dy="27">grade and feedback</tspan></text><path d="M1430 215 C1285 220 1195 290 1070 385" class="flow"/><rect width="325" height="65" x="1095" y="165" class="labelbox" rx="8"/><text x="1258" y="192" class="label"><tspan x="1258">assignment policy,</tspan><tspan x="1258" dy="27">review and grade</tspan></text><path d="M1100 420 C1230 340 1320 315 1435 325" class="flow"/><rect width="320" height="65" x="1120" y="330" class="labelbox" rx="8"/><text x="1280" y="357" class="label"><tspan x="1280">submission and</tspan><tspan x="1280" dy="27">similarity data</tspan></text><path d="M1430 775 C1280 775 1190 710 1065 625" class="flow"/><rect width="330" height="65" x="1100" y="765" class="labelbox" rx="8"/><text x="1265" y="792" class="label"><tspan x="1265">companies, rounds and</tspan><tspan x="1265" dy="27">checklist items</tspan></text><path d="M1095 585 C1225 675 1320 665 1435 655" class="flow"/><rect width="330" height="65" x="1110" y="645" class="labelbox" rx="8"/><text x="1275" y="672" class="label"><tspan x="1275">publication and</tspan><tspan x="1275" dy="27">reminder status</tspan></text><text x="70" y="950" class="foot">Context diagram: internal processes and persistent stores are decomposed in Level 1.</text></svg>