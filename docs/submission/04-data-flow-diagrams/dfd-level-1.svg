  <path class="edge" d="M1015 465 L1375 465"/><text class="label" x="1195" y="448">placement records</text>

  <path class="edge" d="M335 255 C425 380 470 640 555 690"/><text class="label" x="430" y="575">submission file</text>
  <path class="edge" d="M555 760 C445 790 415 650 330 600"/><text class="label" x="430" y="750"><tspan x="430">late decision,</tspan><tspan x="430" dy="20">grade and feedback</tspan></text>
  <path class="edge" d="M335 550 C430 565 475 650 555 680"/><text class="label" x="450" y="620">policy, review, grade</text>
  <path class="edge" d="M1015 720 L1375 720"/><text class="label" x="1195" y="703">assignments and submissions</text>

  <path class="edge" d="M800 550 C875 685 880 820 810 890"/><text class="label" x="900" y="735">publish events</text>
  <path class="edge" d="M760 805 L760 890"/><text class="label" x="670" y="855">workflow events</text>
  <path class="edge" d="M1015 975 L1375 975"/><text class="label" x="1195" y="958">audit and reminder records</text>
  <path class="edge" d="M555 1000 C440 1035 400 940 330 900"/><text class="label" x="440" y="1015">T-24h reminder status</text>
</svg>
