[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadlinedesk"
version = "0.1.0"
description = "Campus placement and academic deadline system for UCS503P"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Django==5.2.5"]

[tool.pytest.ini_options]
pythonpath = ["code"]
DJANGO_SETTINGS_MODULE = "deadlinedesk.settings"
testpaths = ["code/core/tests"]
addopts = "-q"
