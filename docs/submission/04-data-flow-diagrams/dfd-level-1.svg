<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" aria-labelledby="title desc" role="img" viewBox="0 0 1900 1200"><title id="title">DeadlineDesk Level 1 data-flow diagram</title><desc id="desc">Four DeadlineDesk processes, three external roles, and four persistent data stores with routed data flows.</desc><defs><marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="4"><path fill="#56637b" d="M0,0 L12,4 L0,8 Z"/></marker><style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#12213f;stroke-width:4}.proc{fill:#edf3ff;stroke:#2862b8}.proc,.procp,.store{stroke-width:4}.procp{fill:#fff5da;stroke:#d88a00}.store{fill:#fff;stroke:#12213f}.title{font:700 45px Arial,sans-serif;fill:#12213f}.section{font:700 21px Arial,sans-serif;fill:#687389;letter-spacing:2px}.p,.t{fill:#12213f;text-anchor:middle;word-spacing:4px}.t{font:700 27px Arial,sans-serif}.p{font:700 25px Arial,sans-serif}.flow{stroke:#56637b;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.labelbox{fill:#f7f5ef;opacity:.97}.label,.small{font:600 20px Arial,sans-serif;fill:#30394c;text-anchor:middle;word-spacing:4px}.small{font:18px Arial,sans-serif;fill:#596276}</style></defs><rect width="1900" height="1200" class="bg"/><text x="950" y="60" class="title" text-anchor="middle">DeadlineDesk - Data-Flow Diagram (Level 1)</text><text x="210" y="110" class="section" text-anchor="middle">EXTERNAL ENTITIES</text><text x="830" y="110" class="section" text-anchor="middle">PROCESSES</text><text x="1600" y="110" class="section" text-anchor="middle">DATA STORES</text><rect width="290" height="100" x="70" y="130" class="ext" rx="10"/><text x="215" y="172" class="t"><tspan x="215">All authenticated</tspan><tspan x="215" dy="31">roles</tspan></text><rect width="290" height="105" x="70" y="315" class="ext" rx="10"/><text x="215" y="378" class="t">Placement Admin</text><rect width="290" height="105" x="70" y="570" class="ext" rx="10"/><text x="215" y="633" class="t">Student</text><rect width="290" height="105" x="70" y="825" class="ext" rx="10"/><text x="215" y="888" class="t">TA / Faculty</text><ellipse cx="830" cy="180" class="proc" rx="225" ry="72"/><text x="830" y="172" class="p"><tspan x="830">1.0 Authentication</tspan><tspan x="830" dy="30">and Roles</tspan></text><ellipse cx="830" cy="430" class="procp" rx="225" ry="72"/><text x="830" y="438" class="p">2.0 Placement Track</text><ellipse cx="830" cy="735" class="proc" rx="225" ry="72"/><text x="830" y="743" class="p">3.0 Academic Dropbox</text><ellipse cx="830" cy="1030" class="procp" rx="225" ry="72"/><text x="830" y="1022" class="p"><tspan x="830">4.0 Reminder</tspan><tspan x="830" dy="30">and Audit</tspan></text><g><rect width="390" height="100" x="1420" y="130" class="store"/><line x1="1450" x2="1450" y1="130" y2="230" stroke="#12213f" stroke-width="4"/><text x="1625" y="190" class="t">D1 Users and Roles</text></g><g><rect width="390" height="100" x="1420" y="380" class="store"/><line x1="1450" x2="1450" y1="380" y2="480" stroke="#12213f" stroke-width="4"/><text x="1625" y="440" class="t">D2 Placement Data</text></g><g><rect width="390" height="100" x="1420" y="685" class="store"/><line x1="1450" x2="1450" y1="685" y2="785" stroke="#12213f" stroke-width="4"/><text x="1625" y="745" class="t">D3 Academic Data</text></g><g><rect width="390" height="100" x="1420" y="980" class="store"/><line x1="1450" x2="1450" y1="980" y2="1080" stroke="#12213f" stroke-width="4"/><text x="1625" y="1020" class="t"><tspan x="1625">D4 Audit and</tspan><tspan x="1625" dy="28">Reminder Logs</tspan></text></g><path d="M360 180 H605" class="flow"/><rect width="160" height="34" x="405" y="137" class="labelbox" rx="7"/><text x="485" y="161" class="label">credentials</text><path d="M830 252 V350" class="flow"/><rect width="140" height="34" x="850" y="278" class="labelbox" rx="7"/><text x="920" y="302" class="label">role context</text><path d="M930 242 C1080 350 1080 620 930 675" class="flow"/><rect width="140" height="34" x="1010" y="470" class="labelbox" rx="7"/><text x="1080" y="494" class="label">role context</text><path d="M360 350 H605" class="flow"/><rect width="190" height="60" x="395" y="302" class="labelbox" rx="7"/><text x="490" y="327" class="label"><tspan x="490">company, round,</tspan><tspan x="490" dy="24">checklist data</tspan></text><path d="M605 405 H360" class="flow"/><rect width="175" height="34" x="405" y="412" class="labelbox" rx="7"/><text x="492" y="436" class="label">publish status</text><path d="M360 595 C455 565 505 500 620 465" class="flow"/><rect width="175" height="34" x="385" y="515" class="labelbox" rx="7"/><text x="472" y="539" class="label">checklist update</text><path d="M620 480 C520 535 470 610 360 645" class="flow"/><rect width="180" height="60" x="455" y="585" class="labelbox" rx="7"/><text x="545" y="610" class="label"><tspan x="545">rounds and</tspan><tspan x="545" dy="24">readiness</tspan></text><path d="M360 650 C470 675 520 690 615 715" class="flow"/><rect width="170" height="34" x="430" y="658" class="labelbox" rx="7"/><text x="515" y="682" class="label">submission file</text><path d="M615 760 C510 790 465 745 360 700" class="flow"/><rect width="205" height="60" x="410" y="750" class="labelbox" rx="7"/><text x="512" y="775" class="label"><tspan x="512">late result, grade</tspan><tspan x="512" dy="24">and feedback</tspan></text><path d="M360 850 H605" class="flow"/><rect width="200" height="60" x="395" y="802" class="labelbox" rx="7"/><text x="495" y="827" class="label"><tspan x="495">assignment, review</tspan><tspan x="495" dy="24">and grade</tspan></text><path d="M605 900 H360" class="flow"/><rect width="170" height="34" x="410" y="905" class="labelbox" rx="7"/><text x="495" y="929" class="label">submission data</text><path d="M1055 180 H1420" class="flow"/><text x="1235" y="163" class="small">user and role records</text><path d="M1055 430 H1420" class="flow"/><text x="1235" y="413" class="small">placement records</text><path d="M1055 735 H1420" class="flow"/><text x="1235" y="718" class="small">assignments and submissions</text><path d="M1055 1030 H1420" class="flow"/><text x="1235" y="1013" class="small">audit and reminder records</text><path d="M900 500 C960 650 960 880 895 965" class="flow"/><text x="1015" y="660" class="small">publish event</text><path d="M830 807 V958" class="flow"/><text x="750" y="890" class="small">workflow event</text></svg>