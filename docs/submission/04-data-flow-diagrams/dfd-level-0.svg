<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DeadlineDesk Level 0 data-flow diagram</title><desc id="desc">Context-level flows between DeadlineDesk and Student, TA or Faculty, and Placement Admin.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#536078"/></marker><style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#14213d;stroke-width:3}.proc{fill:#14213d;stroke:#d38b00;stroke-width:8}.h{font:700 42px Arial,sans-serif;fill:#14213d}.t{font:700 26px Arial,sans-serif;fill:#14213d;text-anchor:middle}.pt{font:700 34px Arial,sans-serif;fill:#fff;text-anchor:middle}.edge{stroke:#536078;stroke-width:3;fill:none;marker-end:url(#a)}.label{font:18px Arial,sans-serif;fill:#30394c;text-anchor:middle}.legend{font:18px Arial,sans-serif;fill:#687083}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="h" x="800" y="65" text-anchor="middle">DeadlineDesk — Data-Flow Diagram (Level 0)</text>
  <rect class="ext" x="70" y="145" width="300" height="120" rx="10"/><text class="t" x="220" y="215">Student</text>
  <rect class="ext" x="1230" y="145" width="300" height="120" rx="10"/><text class="t" x="1380" y="215">TA / Faculty</text>
  <rect class="ext" x="1230" y="635" width="300" height="120" rx="10"/><text class="t" x="1380" y="705">Placement Admin</text>
  <circle class="proc" cx="800" cy="450" r="210"/><text class="pt" x="800" y="432"><tspan x="800">0.</tspan><tspan x="800" dy="46">DeadlineDesk</tspan></text>
  <path class="edge" d="M370 185 C510 185 560 300 630 350"/><text class="label" x="505" y="185"><tspan x="505">login, checklist updates,</tspan><tspan x="505" dy="22">assignment submissions</tspan></text>
  <path class="edge" d="M640 535 C535 620 470 655 365 665"/><text class="label" x="490" y="630"><tspan x="490">round readiness, late decision,</tspan><tspan x="490" dy="22">grade and feedback</tspan></text>
  <path class="edge" d="M1230 205 C1085 220 1045 295 970 350"/><text class="label" x="1095" y="178"><tspan x="1095">assignments, late policies,</tspan><tspan x="1095" dy="22">reviews and grades</tspan></text>
  <path class="edge" d="M975 515 C1060 565 1125 585 1235 590"/><text class="label" x="1110" y="540"><tspan x="1110">submission files, status,</tspan><tspan x="1110" dy="22">similarity stub</tspan></text>
  <path class="edge" d="M1230 695 C1080 690 1035 620 965 555"/><text class="label" x="1105" y="710"><tspan x="1105">companies, rounds,</tspan><tspan x="1105" dy="22">checklist items</tspan></text>
  <path class="edge" d="M890 640 C980 765 1090 790 1235 780"/><text class="label" x="1060" y="805">publication status and reminder log</text>
  <text class="legend" x="70" y="855">External entities exchange data with one system-level process; internal data stores appear in Level 1.</text>
</svg>
