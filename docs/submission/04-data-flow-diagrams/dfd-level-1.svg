<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" aria-labelledby="title desc" role="img" viewBox="0 0 1800 1200"><title id="title">DeadlineDesk Level 1 data-flow diagram</title><desc id="desc">Four DeadlineDesk processes, three external roles, and four persistent data stores.</desc><defs><marker id="a" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#59657c" d="M0,0 L10,3 L0,6 Z"/></marker><style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#14213d;stroke-width:3}.proc{fill:#eef4ff;stroke:#275dad}.proc,.proc2,.store{stroke-width:3}.proc2{fill:#fff8e7;stroke:#d38b00}.store{fill:#fff;stroke:#14213d}.h,.p,.t{fill:#14213d}.h{font:700 42px Arial,sans-serif}.p,.t{text-anchor:middle}.t{font:700 24px Arial,sans-serif}.p{font:700 23px Arial,sans-serif}.edge{stroke:#59657c;stroke-width:2.5;fill:none;marker-end:url(#a)}.label{font:16px Arial,sans-serif;fill:#30394c;text-anchor:middle}.section{font:700 18px Arial,sans-serif;fill:#747c8c;letter-spacing:2px}</style></defs><rect width="1800" height="1200" class="bg"/><text x="900" y="58" class="h" text-anchor="middle">DeadlineDesk — Data-Flow Diagram (Level 1)</text><text x="150" y="108" class="section">EXTERNAL ENTITIES</text><text x="900" y="108" class="section" text-anchor="middle">PROCESSES</text><text x="1620" y="108" class="section" text-anchor="middle">DATA STORES</text><rect width="280" height="100" x="55" y="170" class="ext" rx="9"/><text x="195" y="230" class="t">Student</text><rect width="280" height="100" x="55" y="490" class="ext" rx="9"/><text x="195" y="550" class="t">TA / Faculty</text><rect width="280" height="100" x="55" y="810" class="ext" rx="9"/><text x="195" y="870" class="t">Placement Admin</text><ellipse cx="780" cy="210" class="proc" rx="235" ry="85"/><text x="780" y="202" class="p"><tspan x="780">1.0 Authentication</tspan><tspan x="780" dy="30">and Roles</tspan></text><ellipse cx="780" cy="465" class="proc2" rx="235" ry="85"/><text x="780" y="457" class="p"><tspan x="780">2.0 Placement</tspan><tspan x="780" dy="30">Track</tspan></text><ellipse cx="780" cy="720" class="proc" rx="235" ry="85"/><text x="780" y="712" class="p"><tspan x="780">3.0 Academic</tspan><tspan x="780" dy="30">Dropbox</tspan></text><ellipse cx="780" cy="975" class="proc2" rx="235" ry="85"/><text x="780" y="967" class="p"><tspan x="780">4.0 Reminder</tspan><tspan x="780" dy="30">and Audit</tspan></text><g><rect width="360" height="110" x="1375" y="155" class="store"/><line x1="1400" x2="1400" y1="155" y2="265" stroke="#14213d" stroke-width="3"/><text x="1565" y="218" class="t">D1 Users and Roles</text></g><g><rect width="360" height="110" x="1375" y="410" class="store"/><line x1="1400" x2="1400" y1="410" y2="520" stroke="#14213d" stroke-width="3"/><text x="1565" y="473" class="t">D2 Placement Data</text></g><g><rect width="360" height="110" x="1375" y="665" class="store"/><line x1="1400" x2="1400" y1="665" y2="775" stroke="#14213d" stroke-width="3"/><text x="1565" y="728" class="t">D3 Academic Data</text></g><g><rect width="360" height="110" x="1375" y="920" class="store"/><line x1="1400" x2="1400" y1="920" y2="1030" stroke="#14213d" stroke-width="3"/><text x="1565" y="970" class="t"><tspan x="1565">D4 Audit and</tspan><tspan x="1565" dy="27">Reminder Logs</tspan></text></g><path d="M335 205 L545 205" class="edge"/><text x="440" y="190" class="label">credentials</text><path d="M335 520 C420 435 460 300 550 240" class="edge"/><text x="420" y="370" class="label">credentials</text><path d="M335 840 C420 700 455 335 555 250" class="edge"/><text x="420" y="655" class="label">credentials</text><path d="M1015 210 L1375 210" class="edge"/><text x="1195" y="193" class="label">user and role lookup</text><path d="M750 295 L750 380" class="edge"/><text x="665" y="342" class="label">role context</text><path d="M820 295 C900 410 900 575 820 635" class="edge"/><text x="930" y="470" class="label">role context</text><path d="M335 245 C440 270 465 380 555 420" class="edge"/><text x="450" y="318" class="label">checklist updates</text><path d="M555 500 C455 535 415 420 330 320" class="edge"/><text x="435" y="482" class="label">rounds and readiness</text><path d="M335 855 C430 780 475 570 560 500" class="edge"/><text x="430" y="685" class="label"><tspan x="430">companies, rounds,</tspan><tspan x="430" dy="20">requirements</tspan></text><path d="M1015 465 L1375 465" class="edge"/><text x="1195" y="448" class="label">placement records</text><path d="M335 255 C425 380 470 640 555 690" class="edge"/><text x="430" y="575" class="label">submission file</text><path d="M555 760 C445 790 415 650 330 600" class="edge"/><text x="430" y="750" class="label"><tspan x="430">late decision,</tspan><tspan x="430" dy="20">grade and feedback</tspan></text><path d="M335 550 C430 565 475 650 555 680" class="edge"/><text x="450" y="620" class="label">policy, review, grade</text><path d="M1015 720 L1375 720" class="edge"/><text x="1195" y="703" class="label">assignments and submissions</text><path d="M800 550 C875 685 880 820 810 890" class="edge"/><text x="900" y="735" class="label">publish events</text><path d="M760 805 L760 890" class="edge"/><text x="670" y="855" class="label">workflow events</text><path d="M1015 975 L1375 975" class="edge"/><text x="1195" y="958" class="label">audit and reminder records</text><path d="M555 1000 C440 1035 400 940 330 900" class="edge"/><text x="440" y="1015" class="label">T-24h reminder status</text></svg>