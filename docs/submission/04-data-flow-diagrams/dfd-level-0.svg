<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1600 900"><title id="title">DeadlineDesk Level 0 data-flow diagram</title><desc id="desc">Context-level flows between DeadlineDesk and Student, TA or Faculty, and Placement Admin.</desc><defs><marker id="a" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#536078" d="M0,0 L10,3 L0,6 Z"/></marker><style>.bg{fill:#f7f5ef}.ext{fill:#fff;stroke:#14213d;stroke-width:3}.proc{fill:#14213d;stroke:#d38b00;stroke-width:8}.h{font:700 42px Arial,sans-serif}.h,.t{fill:#14213d}.pt,.t{text-anchor:middle}.t{font:700 26px Arial,sans-serif}.pt{font:700 34px Arial,sans-serif;fill:#fff}.edge{stroke:#536078;stroke-width:3;fill:none;marker-end:url(#a)}.label,.legend{font:18px Arial,sans-serif}.label{fill:#30394c;text-anchor:middle}.legend{fill:#687083}</style></defs><rect width="1600" height="900" class="bg"/><text x="800" y="65" class="h" text-anchor="middle">DeadlineDesk — Data-Flow Diagram (Level 0)</text><rect width="300" height="120" x="70" y="145" class="ext" rx="10"/><text x="220" y="215" class="t">Student</text><rect width="300" height="120" x="1230" y="145" class="ext" rx="10"/><text x="1380" y="215" class="t">TA / Faculty</text><rect width="300" height="120" x="1230" y="635" class="ext" rx="10"/><text x="1380" y="705" class="t">Placement Admin</text><circle cx="800" cy="450" r="210" class="proc"/><text x="800" y="432" class="pt"><tspan x="800">0.</tspan><tspan x="800" dy="46">DeadlineDesk</tspan></text><path d="M370 185 C510 185 560 300 630 350" class="edge"/><text x="505" y="185" class="label"><tspan x="505">login, checklist updates,</tspan><tspan x="505" dy="22">assignment submissions</tspan></text><path d="M640 535 C535 620 470 655 365 665" class="edge"/><text x="490" y="630" class="label"><tspan x="490">round readiness, late decision,</tspan><tspan x="490" dy="22">grade and feedback</tspan></text><path d="M1230 205 C1085 220 1045 295 970 350" class="edge"/><text x="1095" y="178" class="label"><tspan x="1095">assignments, late policies,</tspan><tspan x="1095" dy="22">reviews and grades</tspan></text><path d="M975 515 C1060 565 1125 585 1235 590" class="edge"/><text x="1110" y="540" class="label"><tspan x="1110">submission files, status,</tspan><tspan x="1110" dy="22">similarity stub</tspan></text><path d="M1230 695 C1080 690 1035 620 965 555" class="edge"/><text x="1105" y="710" class="label"><tspan x="1105">companies, rounds,</tspan><tspan x="1105" dy="22">checklist items</tspan></text><path d="M890 640 C980 765 1090 790 1235 780" class="edge"/><text x="1060" y="805" class="label">publication status and reminder log</text><text x="70" y="855" class="legend">External entities exchange data with one system-level process; internal data stores appear in Level 1.</text></svg>